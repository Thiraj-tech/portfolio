name: Deploy to VPS

on:
  push:
    branches: [ master ]
  schedule:
    # Daily rebuild so blog posts added/edited in the admin UI (stored in
    # Supabase, baked into the static export at build time) go live without
    # needing a code push.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/sites/portfolio
            git pull origin master
            docker compose up -d --build
