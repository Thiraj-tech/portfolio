server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|webp|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
